---
- name: Get absolute path to this Git repository # noqa: command-instead-of-module
  ansible.builtin.command: git rev-parse --show-toplevel
  delegate_to: localhost
  become: false
  run_once: true
  register: repository_path
  changed_when: false
  check_mode: false
  failed_when: repository_path.rc != 0

- name: Check whether an existing kubeconfig is present
  ansible.builtin.stat:
    path: "{{ repository_path.stdout }}/kubeconfig"
  delegate_to: localhost
  become: false
  run_once: true
  register: existing_kubeconfig

- name: Backup existing kubeconfig
  ansible.builtin.command:
    argv:
      - mv
      - "{{ repository_path.stdout }}/kubeconfig"
      - "{{ repository_path.stdout }}/kubeconfig.{{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}.bak"
  delegate_to: localhost
  become: false
  run_once: true
  when: existing_kubeconfig.stat.exists
  changed_when: true

- name: Copy kubeconfig to the project directory
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ repository_path.stdout }}/kubeconfig"
    flat: true

- name: Update kubeconfig with the correct load balancer address
  ansible.builtin.replace:
    path: "{{ repository_path.stdout }}/kubeconfig"
    regexp: "https://127\\.0\\.0\\.1:6443"
    replace: "https://{{ k3s_registration_address }}:6443"
  delegate_to: localhost
  become: false
  run_once: true
