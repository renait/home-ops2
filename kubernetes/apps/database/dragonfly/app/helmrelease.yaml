---
# yaml-language-server: $schema=https://homelab-schemas-epg.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dragonfly-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: dragonfly-operator
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: Skip
    remediation:
      retries: 3
  values:
    crds:
      install: true
      keep: true
    rbacProxy:
      enabled: false
    serviceMonitor:
      enabled: true
    grafanaDashboard:
      enabled: true
      folder: Dragonfly
      annotations:
        name: grafana_folder
      labels:
        name: grafana_dashboard
