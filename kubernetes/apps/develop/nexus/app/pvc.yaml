---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nexus-backup
  labels:
    app.kubernetes.io/name: nexus
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  nfs:
    path: /mnt/data/k8s/nexus-repository-manager/backup
    server: 192.168.12.41
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  mountOptions:
    - nfsvers=4.2
    - nconnect=8
    - hard
    - noatime
    - rsize=131072
    - wsize=131072
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nexus-blobs-default
  labels:
    app.kubernetes.io/name: nexus
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteOnce
  nfs:
    path: /mnt/data/k8s/nexus-repository-manager/blobs-default
    server: 192.168.12.41
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  mountOptions:
    - nfsvers=4.2
    - nconnect=8
    - hard
    - noatime
    - rsize=131072
    - wsize=131072
