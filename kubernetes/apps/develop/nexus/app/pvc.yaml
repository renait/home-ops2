    - wsize=131072
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nexus-backup
  labels:
    app.kubernetes.io/name: nexus
spec:
  accessModes:
    - ReadWriteOnce
  volumeName: nexus-backup
  resources:
    requests:
      storage: 20Gi
