---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}-dragonfly-ui
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      redisinsight:
        initContainers:
          wait-redis:
            image:
              repository: alpine
              tag: 3.24.1
            command:
              - sh
            args:
              - -c
              - >-
                until nc -w 1 -v $REDIS_HOST:$REDIS_HOST_PORT;
                do echo "Waiting for Redis";
                done
            env:
              - name: REDIS_HOST
                value: &redisHost "${APP}-dragonfly"
              - name: REDIS_HOST_PORT
                value: &redisPort "6379"

        containers:
          app:
            image:
              repository: redis/redisinsight
              tag: 3.8.0
            env:
              TZ: "${TIMEZONE}"
              RI_ACCEPT_TERMS_AND_CONDITIONS: "${REDISINSIGHT_ACCEPT_TAC:-true}"
              RI_DATABASE_MANAGEMENT: "${REDISINSIGHT_MANAGEMENT:-false}"
              RI_FILES_LOGGER: false
              RI_STDOUT_LOGGER: true
              RI_REDIS_ALIAS: "${APP}"
              RI_REDIS_HOST: *redisHost
              RI_REDIS_PORT: *redisPort
              RI_REDIS_USERNAME: "${REDISINSIGHT_USERNAME:-default}"
              RI_REDIS_PASSWORD: "${REDISINSIGHT_PASSWORD:-}"
              RI_REDIS_DB: "${REDISINSIGHT_DB:-0}"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 568
              runAsGroup: 568
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: redisinsight
        ports:
          http:
            port: 5540
    ingress:
      app:
        className: internal
        hosts:
          - host: "${APP}-dragonfly-ui.${SECRET_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
    persistence:
      data:
        type: emptyDir
